<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../icons/light-icon.png">
    <script src="../ttstudents.js"></script>
    <title>Quadrants</title>
      
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BIPH Band">
    <link rel="apple-touch-icon" href="https://cdn.glitch.global/bed65df6-4eb8-4247-853c-e198a6399561/icons%2FBGicon.png">
   
    <link rel="icon" href="../icons/BGicon.png">
    <style>
        :root {
            --accent: #4bdbff;
            --accent-dark: #3b7ccc;
            --bg: #0a0a0a;
            --card: rgba(255, 255, 255, 0.06);
            --card-hover: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.18);
            --muted: #aaa;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            background: var(--bg);
            color: #eee;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .student {
            position: absolute;
            background: var(--card);
            padding: 10px 20px;
            border: 1px solid var(--border);
            border-radius: 14px;
            color: #eee;
            transform: translate(-50%, -50%);
            transition: all 0.7s cubic-bezier(0.25, 0.1, 0.25, 1);
            pointer-events: auto;
            white-space: nowrap;
            font-size: 1.1em;
            opacity: 0;
            cursor: grab;
            z-index: 10;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
        }

        .student:active {
            cursor: grabbing;
            transform: translate(-50%, -50%) scale(1.08);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
            z-index: 1000;
            border-color: var(--accent);
        }

        /* Leader highlight – cyan accent */
        .student.leader {
            background: rgba(75, 219, 255, 0.18);
            border: 2px solid var(--accent);
            box-shadow: 0 0 20px rgba(75, 219, 255, 0.35),
                        0 4px 18px rgba(0, 0, 0, 0.4);
            z-index: 50;
            font-weight: 600;
            color: white;
        }

        .shuffle-btn {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.6em;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 100px;
            height: 100px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 200;
            pointer-events: auto;
            color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
       
        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border);
            color: #eee;
            font-size: 2em;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        .quad-input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: #eee;
            font-size: 1.85em;
            text-align: center;
            outline: none;
            padding: 0 20px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .quad-input::placeholder {
            color: var(--muted);
        }

        .shuffle-btn:hover {
            background: rgba(75, 219, 255, 0.15);
            border-color: var(--accent);
            transform: translate(-50%, -50%) scale(1.12);
            box-shadow: 0 0 24px rgba(75, 219, 255, 0.25);
            color: var(--accent);
        }

        .edit-btn {
            position: fixed;
            top: 65px;
            left: 20px;
            font-size: 1.4em;
            background: var(--card);
            border: 1px solid var(--border);
            color: #eee;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .edit-btn:hover {
            background: rgba(75, 219, 255, 0.15);
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(1.1);
        }

        #editPanel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(14, 14, 14, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px 32px;
            width: 92%;
            max-width: 420px;
            max-height: 85vh;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6);
        }

        #editPanel h3 {
            margin: 0 0 22px 0;
            text-align: center;
            font-size: 1.5em;
            color: white;
            font-weight: 500;
        }

        .student-list {
            max-height: 58vh;
            overflow-y: auto;
            padding-right: 6px;
        }

        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 8px;
            background: var(--card);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.2s ease;
        }

        .student-item span {
            color: #eee;
            font-size: 1.05em;
        }

        .student-item:hover {
            background: var(--card-hover);
            border-color: rgba(75, 219, 255, 0.25);
        }

        .remove-btn {
            background: rgba(255, 70, 70, 0.2);
            color: #ff8a8a;
            border: 1px solid rgba(255, 70, 70, 0.35);
            padding: 7px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.2s;
        }

        .remove-btn:hover {
            background: rgba(255, 70, 70, 0.4);
            color: white;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 14px;
            font-size: 1.1em;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--card);
            color: #eee;
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 500;
        }

        .modal-buttons button:hover {
            background: rgba(75, 219, 255, 0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Optional subtle accent glow on the center cross */
        .box:nth-child(1),
        .box:nth-child(2) {
            border-bottom: 1px solid rgba(75, 219, 255, 0.12);
        }
        .box:nth-child(1),
        .box:nth-child(3) {
            border-right: 1px solid rgba(75, 219, 255, 0.12);
        }
    </style>
</head>
<body>
    <div id="shared-menu"></div>
    <script src="../menu.js"></script>
    <!-- Edit Button -->
    <button onclick="toggleEditPanel()" class="edit-btn">✏️</button>
    <div class="container">
        <div class="box"><input type="text" class="quad-input" placeholder=""></div>
        <div class="box"><input type="text" class="quad-input" placeholder=""></div>
        <div class="box"><input type="text" class="quad-input" placeholder=""></div>
        <div class="box"><input type="text" class="quad-input" placeholder=""></div>
        <button class="shuffle-btn">🔀</button>
    </div>
    <!-- Edit Panel -->
    <div id="editPanel">
        <h3>Edit Roster</h3>
        <div class="student-list" id="studentList"></div>
       
        <div class="modal-buttons">
            <button onclick="toggleEditPanel()">Done</button>
            <button onclick="resetToFullRoster()">Reset Full Roster</button>
        </div>
    </div>
    <script>
        let currentStudents = [];
        let studentElements = [];
        let isDragging = false;
        let draggedElement = null;
        const container = document.querySelector('.container');
        const shuffleBtn = document.querySelector('.shuffle-btn');
        let isInputFocused = false;
        // Make element draggable
        function makeDraggable(element) {
            let offsetX, offsetY;
            element.addEventListener('mousedown', (e) => {
                if (document.getElementById('editPanel').style.display === 'block') return;
                if (isInputFocused) return;
                isDragging = true;
                draggedElement = element;
                const rect = element.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                element.style.transition = 'none';
                element.style.zIndex = 1000;
            });
        }
        function onMouseMove(e) {
            if (!isDragging || !draggedElement) return;
            const containerRect = container.getBoundingClientRect();
            let newLeft = e.clientX - containerRect.left;
            let newTop = e.clientY - containerRect.top;
            // Keep within bounds
            newLeft = Math.max(40, Math.min(newLeft, containerRect.width - 40));
            newTop = Math.max(40, Math.min(newTop, containerRect.height - 40));
            draggedElement.style.left = `${newLeft}px`;
            draggedElement.style.top = `${newTop}px`;
        }
        function onMouseUp() {
            if (draggedElement) {
                draggedElement.style.transition = 'all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1)';
                draggedElement.style.zIndex = 10;
            }
            isDragging = false;
            draggedElement = null;
        }
        function initRoster() {
            if (typeof ttStudents !== 'undefined' && ttStudents.length > 0) {
                currentStudents = ttStudents.slice();
            } else {
                console.error("ttStudents not found!");
                currentStudents = [];
            }
            createStudentElements();
        }
        function createStudentElements() {
            studentElements.forEach(el => el.remove());
            studentElements = [];
            currentStudents.forEach(student => {
                const name = student.name || student.altName || "";
                if (!name) return;
                const div = document.createElement('div');
                div.className = 'student';
                div.textContent = name;
                div.style.left = '50%';
                div.style.top = '50%';
                container.appendChild(div);
                studentElements.push(div);
                makeDraggable(div);
            });
        }
        function toggleEditPanel() {
            const panel = document.getElementById('editPanel');
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
            } else {
                refreshStudentList();
                panel.style.display = 'block';
            }
        }
        function refreshStudentList() {
            const list = document.getElementById('studentList');
            list.innerHTML = '';
            currentStudents.forEach((student, index) => {
                const div = document.createElement('div');
                div.className = 'student-item';
                const span = document.createElement('span');
                span.textContent = student.name || student.altName || "";
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = 'Remove';
                removeBtn.addEventListener('click', function(e) {
                    e.stopImmediatePropagation();
                    removeStudent(index);
                });
                div.appendChild(span);
                div.appendChild(removeBtn);
                list.appendChild(div);
            });
        }
        function removeStudent(index) {
            if (index < 0 || index >= currentStudents.length) return;
            currentStudents.splice(index, 1);
            refreshStudentList();
            createStudentElements();
        }
        function resetToFullRoster() {
            if (typeof ttStudents !== 'undefined') {
                currentStudents = ttStudents.slice();
                refreshStudentList();
                createStudentElements();
            }
        }
        function getRandomPositionInQuadrant(quadIndex, existingPositions, minDistance = 95) {
            const rect = container.getBoundingClientRect();
            const qWidth = rect.width / 2;
            const qHeight = rect.height / 2;
            const baseX = (quadIndex % 2) * qWidth;
            const baseY = Math.floor(quadIndex / 2) * qHeight;
            const maxAttempts = 80;
            let attempts = 0;
            while (attempts < maxAttempts) {
                attempts++;
                const x = baseX + 80 + Math.random() * (qWidth - 160);
                const y = baseY + 70 + Math.random() * (qHeight - 140);
                let tooClose = false;
                for (const pos of existingPositions) {
                    const dx = x - pos.x;
                    const dy = y - pos.y;
                    if (Math.sqrt(dx * dx + dy * dy) < minDistance) {
                        tooClose = true;
                        break;
                    }
                }
                if (!tooClose) return { x, y };
            }
            return {
                x: baseX + 80 + Math.random() * (qWidth - 160),
                y: baseY + 70 + Math.random() * (qHeight - 140)
            };
        }
        function shuffle() {
            // Clear any existing leaders when reshuffling
            clearLeaders();
            shuffleBtn.style.transform = 'translate(-50%, -50%) scale(1.2)';
            shuffleBtn.style.background = 'rgba(75, 219, 255, 0.2)';
            shuffleBtn.style.borderColor = 'var(--accent)';
            shuffleBtn.style.color = 'var(--accent)';
           
            setTimeout(() => {
                shuffleBtn.style.transform = 'translate(-50%, -50%)';
                shuffleBtn.style.background = '';
                shuffleBtn.style.borderColor = '';
                shuffleBtn.style.color = '';
            }, 180);
            studentElements.forEach(s => s.style.opacity = '1');
            const quadrants = [[], [], [], []];
            const shuffledStudents = [...studentElements].sort(() => Math.random() - 0.5);
            shuffledStudents.forEach((student, i) => {
                quadrants[i % 4].push(student);
            });
            quadrants.forEach((quadStudents, qIndex) => {
                const positions = [];
                quadStudents.forEach(student => {
                    const pos = getRandomPositionInQuadrant(qIndex, positions);
                    positions.push(pos);
                    student.style.left = `${pos.x}px`;
                    student.style.top = `${pos.y}px`;
                });
            });
        }
        // ===== Leader selection =====
        function clearLeaders() {
            studentElements.forEach(el => el.classList.remove('leader'));
        }
        function getStudentsByQuadrant() {
            const rect = container.getBoundingClientRect();
            const midX = rect.width / 2;
            const midY = rect.height / 2;
            const quads = [[], [], [], []]; // 0:TL, 1:TR, 2:BL, 3:BR
            studentElements.forEach(el => {
                // Use the current center position of the element
                const left = parseFloat(el.style.left) || 0;
                const top = parseFloat(el.style.top) || 0;
                let q;
                if (top < midY) {
                    q = left < midX ? 0 : 1; // top row
                } else {
                    q = left < midX ? 2 : 3; // bottom row
                }
                quads[q].push(el);
            });
            return quads;
        }
        function selectLeaders() {
            clearLeaders();
            const quads = getStudentsByQuadrant();
            quads.forEach(studentsInQuad => {
                if (studentsInQuad.length === 0) return;
                const leader = studentsInQuad[Math.floor(Math.random() * studentsInQuad.length)];
                leader.classList.add('leader');
            });
        }
        // Event Listeners
        shuffleBtn.addEventListener('click', shuffle);
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
        document.querySelectorAll('.quad-input').forEach(input => {
            input.addEventListener('focus', () => isInputFocused = true);
            input.addEventListener('blur', () => isInputFocused = false);
            input.addEventListener('keydown', e => {
                if (e.key === 'Escape') input.blur();
            });
        });
        document.addEventListener('keydown', e => {
            if (isInputFocused || isDragging) return;
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                shuffle();
            }
            if (e.key === 'Escape') {
                const panel = document.getElementById('editPanel');
                if (panel.style.display === 'block') toggleEditPanel();
            }
            // Press 'l' / 'L' to pick a random leader in each quadrant
            if (e.key === 'l' || e.key === 'L') {
                e.preventDefault();
                selectLeaders();
            }
        });
        window.addEventListener('resize', () => {
            const rect = container.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            studentElements.forEach(s => {
                s.style.left = `${centerX}px`;
                s.style.top = `${centerY}px`;
            });
            clearLeaders();
        });
        window.addEventListener('load', () => {
            initRoster();
            setTimeout(shuffle, 400);
        });
        // Close modal when clicking outside
        document.addEventListener('click', function(event) {
            const panel = document.getElementById('editPanel');
            if (panel.style.display === 'block' &&
                !panel.contains(event.target) &&
                event.target.closest('.edit-btn') === null) {
                toggleEditPanel();
            }
        });
    </script>
</body>
</html>
