<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>BIPH House Cup 2026</title>
  <link rel="icon" href="../images/housecup-logo.png">

  <style>
    :root {
      --bg: #07090d;
      --panel: #10141b;
      --text: #f5f7fb;
      --muted: #8c96a5;
      --red: #ff4057;
      --blue: #3487ff;
      --green: #32c979;
      --yellow: #f4c542;
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    input, textarea, select {
      -webkit-user-select: text;
      user-select: text;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% -15%, #273142 0, transparent 44%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body { padding: 18px; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(1500px, 100%);
      margin: 0 auto;
    }

    .control-deck {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .squad-buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
    }

    .squad-button {
      min-width: 128px;
      padding: 10px 17px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      color: white;
      cursor: pointer;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 7px 18px rgba(0,0,0,.28);
      transition: filter .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .squad-button:hover {
      filter: brightness(1.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.24), 0 8px 22px rgba(0,0,0,.34);
    }

    .squad-button:active { filter: brightness(.96); }

    .squad-red    { background: linear-gradient(135deg, #ff2746, #a70f2b); }
    .squad-blue   { background: linear-gradient(135deg, #378dff, #1853c8); }
    .squad-green  { background: linear-gradient(135deg, #35d883, #14824e); }
    .squad-yellow { background: linear-gradient(135deg, #ffd95a, #b98a08); color: #17130a; }

    .media-deck {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      align-items: center;
      width: min(300px, 100%);
      min-height: 74px;
      padding: 6px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      background: #121720;
      box-shadow: 0 14px 36px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.06);
      isolation: isolate;
    }

    /* Three low-cost sine-wave layers form a soft, drifting sound visualizer. */
    .media-visualizer {
      position: absolute;
      left: -8%;
      right: -8%;
      bottom: -4px;
      width: 116%;
      height: 76px;
      z-index: -1;
      overflow: visible;
      opacity: 0;
      pointer-events: none;
      filter: blur(18px);
      transition: opacity .3s ease;
    }


    .media-wave {
      transform-box: fill-box;
      transform-origin: center bottom;
      fill: rgba(215,220,228,.34);
    }

    .media-wave.wave-left-a {
      animation: waveLeftA 0.41s linear infinite alternate;
    }

    .media-wave.wave-left-b {
      animation: waveLeftB 0.38s linear infinite alternate;
      fill: rgba(205,211,220,.27);
    }

    .media-wave.wave-right {
      animation: waveRight 0.47s linear infinite alternate;
      fill: rgba(225,229,235,.24);
    }

    .media-deck.music-playing .media-visualizer {
      opacity: 1;
    }

    @keyframes waveLeftA {
      from { transform: translateX(0%) scaleY(100%);}
      to   { transform: translateX(2%) scaleY(25%);}
    }

    @keyframes waveLeftB {
      from { transform: translateX(-0%) scaleY(40%);}
      to   { transform: translateX(-2%) scaleY(100%);}
    }

    @keyframes waveRight {
      from { transform: translateX(-0%) scaleY(60%);}
      to   { transform: translateX(-5%) scaleY(100%);}
    }

    .media-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 58px;
      padding: 0;
      border: 0;
      border-right: 1px solid rgba(255,255,255,.08);
      background: transparent;
      color: #f4f7fb;
      cursor: pointer;
      transition: background .14s ease, transform .12s ease, filter .14s ease;
    }

    .media-button:first-child { border-radius: 0 12px 12px 0; }
    .media-button:last-child {
      border-right: 0;
      border-radius: 0 12px 12px 0;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
    }

    .media-button.media-prev {
      border-radius: 8px 0 0 8px;
    }

    .media-button:hover {
      background: rgba(255,255,255,.07);
      filter: brightness(1.15);
    }

    .media-button:active { transform: scale(.94); }

    .media-button.media-play {
      width: 58px;
      justify-self: center;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 50%;
      background: linear-gradient(180deg, #3b4554, #242b36);
      box-shadow: 0 6px 18px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.14);
    }

    .media-button.media-play:hover {
      background: linear-gradient(180deg, #465263, #2b3441);
    }

    .media-icon {
      position: relative;
      display: block;
      width: 28px;
      height: 28px;
      line-height: 0;
      font-size: 0;
    }

    /* Custom previous / next chevrons and center play/pause shapes. */
    .media-prev .media-icon::before,
    .media-prev .media-icon::after,
    .media-next .media-icon::before,
    .media-next .media-icon::after {
      content: "";
      position: absolute;
      top: 5px;
      width: 3px;
      height: 18px;
      border-radius: 2px;
      background: currentColor;
    }

    .media-prev .media-icon::before { left: 3px; }
    .media-prev .media-icon::after {
      left: 9px;
      width: 15px;
      height: 15px;
      top: 6px;
      background: currentColor;
      clip-path: polygon(100% 0, 0 50%, 100% 100%);
    }

    .media-next .media-icon::before {
      right: 3px;
    }
    .media-next .media-icon::after {
      right: 9px;
      width: 15px;
      height: 15px;
      top: 6px;
      background: currentColor;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
    }

    .media-button.media-play .media-icon {
      width: 22px;
      height: 22px;
      margin-left: 2px;
    }

    .media-button.media-play .media-icon::before {
      content: "";
      position: absolute;
      inset: 2px 1px 2px 4px;
      background: currentColor;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
    }

    .media-button.media-play.is-playing .media-icon {
      margin-left: 0;
    }


    .media-button.media-play.is-playing .media-icon::before,
    .media-button.media-play.is-playing .media-icon::after {
      content: "";
      position: absolute;
      top: 2px;
      bottom: 2px;
      width: 6px;
      border-radius: 2px;
      background: currentColor;
      clip-path: none;
    }

    .media-button.media-play.is-playing .media-icon::before {
      left: 3px;
    }

    .media-button.media-play.is-playing .media-icon::after {
      right: 3px;
    }


    .empty-state {
      min-height: 62vh;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(255,255,255,.11);
      border-radius: 22px;
      background: rgba(16,20,27,.52);
    }

    .empty-state strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 1.15rem;
    }

    .match-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
    }

    .team-panel {
      --team: #fff;
      min-width: 0;
      padding: 17px;
      border: 1px solid color-mix(in srgb, var(--team) 68%, transparent);
      border-top: 5px solid var(--team);
      border-radius: 19px;
      background:
        linear-gradient(180deg,
          color-mix(in srgb, var(--team) 58%, #11151d),
          color-mix(in srgb, var(--team) 42%, #0d1118) 52%,
          color-mix(in srgb, var(--team) 30%, #0b0f15) 100%);
      box-shadow:
        0 18px 48px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.07);
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .team-panel.red    { --team: var(--red); }
    .team-panel.blue   { --team: var(--blue); }
    .team-panel.green  { --team: var(--green); }
    .team-panel.yellow { --team: var(--yellow); }

    .team-header {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
      text-align: center;
    }

    .team-name {
      color: var(--team);
      font-size: 1.02rem;
      font-weight: 900;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .score {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 3.45rem;
      height: 3.45rem;
      min-width: 3.45rem;
      min-height: 3.45rem;
      margin: 0 auto;
      padding: 2px 0;
      border: 1px solid transparent;
      border-radius: 12px;
      font-size: 3.05rem;
      line-height: .92;
      font-weight: 950;
      letter-spacing: -.055em;
      text-shadow: 0 5px 18px color-mix(in srgb, var(--team) 28%, transparent);
      cursor: text;
      transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }

    .score:hover {
      border-color: color-mix(in srgb, var(--team) 38%, transparent);
      background: rgba(0,0,0,.12);
    }

    .score.score-editing {
      border-color: var(--team);
      background: rgba(0,0,0,.25);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--team) 14%, transparent);
    }

    .score-input {
      width: 3.2ch;
      min-width: 3.2ch;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: inherit;
      font-weight: inherit;
      line-height: inherit;
      letter-spacing: inherit;
      text-align: center;
      text-shadow: inherit;
      appearance: textfield;
      -moz-appearance: textfield;
    }

    .score-input::-webkit-outer-spin-button,
    .score-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .goal-button {
      width: 100%;
      padding: 12px;
      border: 1px solid color-mix(in srgb, var(--team) 72%, transparent);
      border-radius: 11px;
      background:
        linear-gradient(135deg,
          color-mix(in srgb, var(--team) 35%, #141922),
          color-mix(in srgb, var(--team) 12%, #10141b));
      color: white;
      cursor: pointer;
      font-size: .8rem;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.09);
      transition: filter .13s ease, box-shadow .13s ease;
    }

    .goal-button:hover {
      filter: brightness(1.13);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 5px 18px color-mix(in srgb, var(--team) 13%, transparent);
    }

    .goal-button:active { filter: brightness(.96); }

    .goal-button.goal-hit,
    .squad-button.squad-hit,
    .player-button.score-hit {
      animation: hypeShake .34s cubic-bezier(.36,.07,.19,.97);
    }

    @keyframes hypeShake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-6px) rotate(-.7deg); }
      30% { transform: translateX(6px) rotate(.7deg); }
      45% { transform: translateX(-5px) rotate(-.5deg); }
      60% { transform: translateX(5px) rotate(.5deg); }
      75% { transform: translateX(-2px); }
    }

    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .5;
      pointer-events: none;
    }

    .player-search {
      width: 100%;
      padding: 13px 15px 13px 40px;
      border: 1px solid color-mix(in srgb, var(--team) 28%, rgba(255,255,255,.1));
      border-radius: 11px;
      outline: none;
      background: rgba(5,8,12,.66);
      color: white;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.35);
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .player-search::placeholder { color: #687282; }

    .player-search:focus {
      border-color: var(--team);
      box-shadow:
        0 0 0 3px color-mix(in srgb, var(--team) 14%, transparent),
        inset 0 1px 3px rgba(0,0,0,.35);
    }

    .player-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 9px;
    }

    .player-button {
      min-height: 88px;
      padding: 11px 8px 9px;
      border: 1px solid color-mix(in srgb, var(--team) 18%, rgba(255,255,255,.08));
      border-radius: 12px;
      background: linear-gradient(180deg, #1a202a, #131820);
      color: white;
      cursor: pointer;
      text-align: center;
      transition: opacity .12s ease, border-color .12s ease, box-shadow .12s ease, filter .12s ease;
    }

    .player-button:hover {
      border-color: color-mix(in srgb, var(--team) 65%, transparent);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--team) 15%, transparent);
      filter: brightness(1.06);
    }

    .player-button:active { filter: brightness(.94); }

    .player-button.prediction-dim { opacity: .10; }

    .player-button.prediction-match {
      border-color: color-mix(in srgb, var(--team) 72%, transparent);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--team) 18%, transparent);
    }

    .player-name {
      display: block;
      min-height: 2.3em;
      font-size: .84rem;
      line-height: 1.15;
      font-weight: 700;
    }

    .player-number {
      display: block;
      margin-top: 5px;
      color: var(--team);
      font-size: 1.55rem;
      line-height: 1;
      font-weight: 950;
    }

    .player-button.score-hit {
      animation: hypeShake .34s cubic-bezier(.36,.07,.19,.97);
    }

    .confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      pointer-events: none;
    }

    /* NEW MATCH MODAL */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2,4,8,.8);
      backdrop-filter: blur(13px);
      animation: fadeIn .18s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .match-modal {
      width: min(650px, 100%);
      padding: 25px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0, #252e3d 0, transparent 47%),
        #11151d;
      box-shadow: 0 30px 90px rgba(0,0,0,.62);
      animation: modalIn .28s cubic-bezier(.2,.85,.25,1.05);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-title {
      margin: 0 0 20px;
      text-align: center;
      font-size: 1.55rem;
      font-weight: 950;
      letter-spacing: -.03em;
    }

    .team-picker {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 11px;
    }

    .team-choice {
      min-height: 108px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 17px;
      color: white;
      cursor: pointer;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
      transition: filter .15s ease, opacity .15s ease, box-shadow .15s ease;
    }

    .team-choice:hover { filter: brightness(1.13); }

    .team-choice.selected {
      box-shadow: 0 0 0 3px white, 0 12px 28px rgba(0,0,0,.32);
    }

    .team-choice.used {
      opacity: .24;
      cursor: default;
    }

    .choice-red    { background: linear-gradient(135deg, #ff4057, #97172c); }
    .choice-blue   { background: linear-gradient(135deg, #3487ff, #174cae); }
    .choice-green  { background: linear-gradient(135deg, #32c979, #126d45); }
    .choice-yellow { background: linear-gradient(135deg, #f4c542, #a67b08); color: #17130a; }

    .modal-cancel {
      display: block;
      margin: 17px auto 0;
      padding: 8px 14px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #778294;
      cursor: pointer;
      font-size: .75rem;
    }

    .modal-cancel:hover {
      color: white;
      background: rgba(255,255,255,.06);
    }

    @media (max-width: 780px) {
      body { padding: 10px; }
      .match-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 520px) {
      .media-button {
        min-width: 110px;
        padding-inline: 12px;
      }
      .squad-button {
        min-width: 110px;
        padding-inline: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="control-deck">
      <div class="squad-buttons">
        <button class="squad-button squad-red" data-squad-team="red" onclick="triggerSquad('red')">Red Squad</button>
        <button class="squad-button squad-blue" data-squad-team="blue" onclick="triggerSquad('blue')">Blue Squad</button>
        <button class="squad-button squad-green" data-squad-team="green" onclick="triggerSquad('green')">Green Squad</button>
        <button class="squad-button squad-yellow" data-squad-team="yellow" onclick="triggerSquad('yellow')">Yellow Squad</button>
      </div>

      <div class="media-deck" id="mediaDeck" aria-label="Music controls">
        <svg class="media-visualizer" viewBox="0 0 400 76" preserveAspectRatio="none" aria-hidden="true">
          <path class="media-wave wave-left-a"
                d="M0 76 V49 C25 23 50 23 75 49 S125 75 150 49 S200 23 225 49 S275 75 300 49 S350 23 375 49 S400 75 425 49 V76 Z"/>
          <path class="media-wave wave-left-b"
                d="M0 76 V57 C25 35 50 35 75 57 S125 79 150 57 S200 35 225 57 S275 79 300 57 S350 35 375 57 S400 79 425 57 V76 Z"/>
          <path class="media-wave wave-right"
                d="M0 76 V44 C25 67 50 67 75 44 S125 21 150 44 S200 67 225 44 S275 21 300 44 S350 67 375 44 S400 21 425 44 V76 Z"/>
        </svg>

        <button class="media-button media-prev" onclick="triggerMusic('previous')" title="Previous" aria-label="Previous">
          <span class="media-icon" aria-hidden="true"></span>
        </button>
        <button class="media-button media-play" id="mediaPlayButton" onclick="triggerMusic('playPause')" title="Play" aria-label="Play music">
          <span class="media-icon" id="mediaPlayIcon" aria-hidden="true"></span>
        </button>
        <button class="media-button media-next" onclick="triggerMusic('next')" title="Next" aria-label="Next">
          <span class="media-icon" aria-hidden="true"></span>
        </button>
      </div>
    </section>

    <section id="matchArea"></section>
  </main>

  <canvas class="confetti-canvas" id="confettiCanvas" aria-hidden="true"></canvas>

  <div class="modal-backdrop" id="matchModalBackdrop" style="display:none;">
    <div class="match-modal" role="dialog" aria-modal="true" aria-labelledby="matchTitle">
      <h2 class="modal-title" id="matchTitle">New Match</h2>
      <div class="team-picker" id="teamPicker"></div>
      <button class="modal-cancel" id="cancelMatchBtn">Cancel</button>
    </div>
  </div>

  <script src="players.js"></script>
  <script>
    const IAC_OUTPUT_NAME = 'IAC Driver Bus 1';
    const SCORE_CHANNEL_NAME = 'biph-scoreboard-v2';

    const squadNotes = {
      yellow: 80,
      blue: 81,
      green: 82,
      red: 83
    };


    const MUSIC_MIDI_CHANNEL = 4;

    const musicNotes = {
      previous: 92,
      playPause: 90,
      next: 91,
      walkout: 93,
      goal: 94
    };

    let musicPlaying = false;

    let midiAccess = null;
    let midiOutput = null;
    let scoreChannel = null;

    let currentMatch = {
      teamA: null,
      teamB: null
    };

    let matchModalOpen = false;
    let modalSelection = [];

    function teamById(id) {
      return teams[id] || null;
    }

    function teamIds() {
      return ['red', 'blue', 'green', 'yellow'];
    }

    function initScoreChannel() {
      if ('BroadcastChannel' in window) {
        scoreChannel = new BroadcastChannel(SCORE_CHANNEL_NAME);
      }
    }

    function broadcastScoreEvent(type, teamId, extra = {}) {
      const message = {
        source: 'biph-controller',
        type,
        teamId,
        timestamp: Date.now(),
        ...extra
      };

      if (scoreChannel) {
        scoreChannel.postMessage(message);
      }

      /*
        This is also useful when the scoreboard was opened from the
        same browser context/window relationship rather than a
        BroadcastChannel-supported context.
      */
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(message, '*');
      }
    }

    function initMIDI() {
      if (!('requestMIDIAccess' in navigator)) {
        console.warn('[MIDI] Web MIDI is not supported.');
        return;
      }

      navigator.requestMIDIAccess()
        .then(midi => {
          midiAccess = midi;

          const exact = Array.from(midi.outputs.values())
            .find(output => output.name === IAC_OUTPUT_NAME);

          if (!exact) {
            console.error(
              `[MIDI] Required output "${IAC_OUTPUT_NAME}" was not found.`,
              Array.from(midi.outputs.values()).map(output => output.name)
            );
            return;
          }

          midiOutput = exact;
          console.log(`[MIDI] Using ${IAC_OUTPUT_NAME}`);
        })
        .catch(error => {
          console.error('[MIDI] Could not access MIDI:', error);
        });
    }

    function sendNoteOn(note, velocity = 0x7f, channel = 0) {
      if (!midiOutput) {
        console.warn(`[MIDI] ${IAC_OUTPUT_NAME} is unavailable.`);
        return;
      }
      midiOutput.send([0x90 + channel, note, velocity]);
    }

    function sendNoteOff(note, channel = 0) {
      if (!midiOutput) return;
      midiOutput.send([0x80 + channel, note, 0]);
    }

    function pulseNote(note, channel = 0, duration = 150) {
      sendNoteOn(note, 0x7f, channel);
      setTimeout(() => sendNoteOff(note, channel), duration);
    }

    function updateMediaPlayerUI() {
      const deck = document.getElementById('mediaDeck');
      const button = document.getElementById('mediaPlayButton');
      const icon = document.getElementById('mediaPlayIcon');
      if (!deck || !button || !icon) return;

      deck.classList.toggle('music-playing', musicPlaying);
      button.classList.toggle('is-playing', musicPlaying);
      icon.textContent = '';
      button.title = musicPlaying ? 'Pause' : 'Play';
      button.setAttribute('aria-label', musicPlaying ? 'Pause music' : 'Play music');
    }

    function triggerMusic(action) {
      // Previous/Next may control the external music system, but they never
      // change the controller's playing state. Only Play/Pause does that.
      const note = musicNotes[action];
      if (note !== undefined) pulseNote(note, MUSIC_MIDI_CHANNEL, 150);

      if (action === 'playPause') {
        musicPlaying = !musicPlaying;
        updateMediaPlayerUI();
      }
    }

    function triggerSquad(teamId) {
      const team = teamById(teamId);
      const note = squadNotes[teamId];
      if (team && note !== undefined) {
        pulseNote(note, team.midiChannel, 200);
      }

      const button = document.querySelector(`[data-squad-team="${teamId}"]`);
      if (button) {
        button.classList.remove('squad-hit');
        void button.offsetWidth;
        button.classList.add('squad-hit');
      }
    }

    const TEAM_CONFETTI_COLORS = {
      red: '#ff4057',
      blue: '#3487ff',
      green: '#32c979',
      yellow: '#f4c542'
    };

    let confettiCanvas = null;
    let confettiContext = null;
    let confettiParticles = [];
    let confettiAnimationFrame = null;

    function initConfetti() {
      confettiCanvas = document.getElementById('confettiCanvas');
      if (!confettiCanvas) return;
      confettiContext = confettiCanvas.getContext('2d');

      const resize = () => {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        confettiCanvas.width = Math.floor(window.innerWidth * dpr);
        confettiCanvas.height = Math.floor(window.innerHeight * dpr);
        confettiCanvas.style.width = window.innerWidth + 'px';
        confettiCanvas.style.height = window.innerHeight + 'px';
        confettiContext.setTransform(dpr, 0, 0, dpr, 0, 0);
      };

      resize();
      window.addEventListener('resize', resize);
    }

    function confettiBurst(teamId, originX = Math.random() * window.innerWidth, originY = window.innerHeight * 0.48, amount = 180) {
      if (!confettiContext) initConfetti();
      if (!confettiContext) return;

      const color = TEAM_CONFETTI_COLORS[teamId] || '#ffffff';
      for (let i = 0; i < amount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 15;
        confettiParticles.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - (Math.random() * 5 + 3),
          gravity: 0.15 + Math.random() * 0.12,
          drag: 0.985,
          size: 10 + Math.random() * 9,
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - .5) * .35,
          life: 85 + Math.random() * 65,
          age: 0,
          color
        });
      }

      if (!confettiAnimationFrame) animateConfetti();
    }

    function launchGoalConfetti(teamId) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const centers = [
        [width * 0.18, height * 0.48],
        [width * 0.50, height * 0.32],
        [width * 0.82, height * 0.48]
      ];

      centers.forEach(([x, y], i) => {
        setTimeout(() => confettiBurst(teamId, x, y, 190), i * 120);
      });
    }

    function animateConfetti() {
      if (!confettiContext) return;
      confettiAnimationFrame = requestAnimationFrame(animateConfetti);

      confettiContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
      confettiParticles = confettiParticles.filter(p => p.age < p.life && p.y < window.innerHeight + 80);

      for (const p of confettiParticles) {
        p.age += 1;
        p.vx *= p.drag;
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rotationSpeed;

        const alpha = Math.max(0, 1 - Math.max(0, p.age - p.life * .7) / (p.life * .3));
        confettiContext.save();
        confettiContext.globalAlpha = alpha;
        confettiContext.translate(p.x, p.y);
        confettiContext.rotate(p.rotation);
        confettiContext.fillStyle = p.color;
        confettiContext.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .58);
        confettiContext.restore();
      }

      if (!confettiParticles.length) {
        cancelAnimationFrame(confettiAnimationFrame);
        confettiAnimationFrame = null;
        confettiContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }
    }

    function saveState() {
      try {
        localStorage.setItem('soccerControllerStateV2', JSON.stringify({
          currentMatch,
          scores: Object.fromEntries(
            Object.values(teams).map(team => [team.id, team.score])
          )
        }));
      } catch (error) {
        console.warn('[STATE] Could not save:', error);
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem('soccerControllerStateV2');
        if (!raw) return;

        const state = JSON.parse(raw);

        if (state.scores) {
          Object.entries(state.scores).forEach(([id, score]) => {
            if (teams[id]) teams[id].score = Number(score) || 0;
          });
        }

        if (
          state.currentMatch &&
          teamById(state.currentMatch.teamA) &&
          teamById(state.currentMatch.teamB)
        ) {
          currentMatch = state.currentMatch;
        }
      } catch (error) {
        console.warn('[STATE] Could not load:', error);
      }
    }

    function resetMatchScores() {
      Object.values(teams).forEach(team => team.score = 0);
    }

    function triggerGoal(teamId) {
      const team = teamById(teamId);
      if (!team) return;

      addScore(teamId);

      const button = document.querySelector(`[data-goal-team="${teamId}"]`);
      if (button) {
        button.classList.remove('goal-hit');
        void button.offsetWidth;
        button.classList.add('goal-hit');
      }
    }

    function addScore(teamId) {
      const team = teamById(teamId);
      if (!team) return;

      team.score = Math.max(0, Number(team.score || 0) + 1);
      saveState();

      broadcastScoreEvent('score-update', teamId, {
        delta: 1,
        score: team.score,
        match: { ...currentMatch },
        celebration: true
      });

      launchGoalConfetti(teamId);
      renderScoresOnly();
    }

    function setScoreQuietly(teamId, value) {
      const team = teamById(teamId);
      if (!team) return;

      const parsed = Number(value);
      if (!Number.isFinite(parsed)) return;

      team.score = Math.max(0, Math.floor(parsed));
      saveState();

      broadcastScoreEvent('score-update', teamId, {
        score: team.score,
        match: { ...currentMatch },
        celebration: false,
        correction: true
      });

      renderScoresOnly();
    }

    function startScoreEdit(teamId) {
      const team = teamById(teamId);
      const scoreElement = document.querySelector(`[data-score-team="${teamId}"]`);
      if (!team || !scoreElement || scoreElement.classList.contains('score-editing')) return;

      scoreElement.classList.add('score-editing');
      scoreElement.innerHTML = '';

      const input = document.createElement('input');
      input.type = 'number';
      input.inputMode = 'numeric';
      input.min = '0';
      input.step = '1';
      input.value = String(team.score || 0);
      input.className = 'score-input';
      input.setAttribute('aria-label', `${team.name} score`);

      const finish = (confirm) => {
        if (!scoreElement.classList.contains('score-editing')) return;

        if (confirm) {
          const parsed = Number(input.value);
          if (Number.isFinite(parsed)) {
            setScoreQuietly(teamId, parsed);
            scoreElement.classList.remove('score-editing');
            scoreElement.textContent = team.score || 0;
            return;
          }
        }

        scoreElement.classList.remove('score-editing');
        scoreElement.textContent = team.score || 0;
      };

      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          finish(true);
        } else if (event.key === 'Escape') {
          event.preventDefault();
          finish(false);
        }
      });

      input.addEventListener('blur', () => {
        // Clicking elsewhere cancels rather than silently changing the score.
        finish(false);
      });

      scoreElement.appendChild(input);
      input.focus();
      input.select();
    }

    function triggerCelebration(teamId, playerIndex, sourceButton = null) {
      const team = teamById(teamId);
      if (!team) return;

      const index = Number(playerIndex);
      const player = Number.isInteger(index) ? team.players[index] : null;
      if (!player) return;

      /*
        Player-specific event remains MIDI.
        Score changes are NOT MIDI anymore; they are broadcast separately.
      */
      pulseNote(player.note, team.midiChannel, 200);

      addScore(teamId);

      // Clicking a player always clears any active search for that team.
      const activeSearch = document.querySelector(`[data-search-team="${teamId}"]`);
      if (activeSearch) {
        activeSearch.value = '';
        filterTeamPlayers(teamId, '');
        activeSearch.blur();
      }

      if (sourceButton) {
        sourceButton.classList.remove('score-hit');
        void sourceButton.offsetWidth;
        sourceButton.classList.add('score-hit');
      }
    }

    function normalize(value) {
      return String(value ?? '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim()
        .toLowerCase();
    }

    function playerMatches(player, query) {
      if (!query) return true;

      const q = normalize(query);
      const name = normalize(player.name);
      const number = normalize(player.number);

      return name.startsWith(q) || number.startsWith(q);
    }

    function filterTeamPlayers(teamId, query) {
      const team = teamById(teamId);
      if (!team) return [];

      const buttons = document.querySelectorAll(
        `[data-player-team="${teamId}"][data-player-index]`
      );

      const normalizedQuery = normalize(query);
      const matches = [];

      buttons.forEach(button => {
        const index = Number(button.dataset.playerIndex);
        const player = Number.isInteger(index) ? team.players[index] : null;
        if (!player) return;

        const isMatch = playerMatches(player, normalizedQuery);

        button.classList.toggle('prediction-dim', Boolean(normalizedQuery && !isMatch));
        button.classList.toggle('prediction-match', Boolean(normalizedQuery && isMatch));

        if (isMatch) matches.push({ player, button });
      });

      return matches;
    }

    function scoreFirstSearchMatch(teamId) {
      const search = document.querySelector(`[data-search-team="${teamId}"]`);
      if (!search) return;

      const query = normalize(search.value);
      if (!query) return;

      const matches = filterTeamPlayers(teamId, query);

      // If the search is an exact player number, prefer that exact number
      // even when other player numbers share the same prefix.
      const exactNumberMatches = matches.filter(({ player }) =>
        normalize(player.number) === query
      );

      if (exactNumberMatches.length === 1) {
        const selected = exactNumberMatches[0];
        const selectedIndex = Number(selected.button.dataset.playerIndex);
        triggerCelebration(teamId, selectedIndex, selected.button);
        return;
      }

      if (matches.length !== 1) return;

      const selected = matches[0];

      const selectedIndex = Number(selected.button.dataset.playerIndex);
      triggerCelebration(teamId, selectedIndex, selected.button);

      // triggerCelebration() clears the search field just as a manual
      // player click does.
    }

    function focusTeamSearch(teamId) {
      if (!currentMatch.teamA && !currentMatch.teamB) return;
      if (teamId !== currentMatch.teamA && teamId !== currentMatch.teamB) return;

      const search = document.querySelector(`[data-search-team="${teamId}"]`);
      if (!search) return;

      search.focus();
      search.select();
    }

    function openMatchModal() {
      matchModalOpen = true;
      modalSelection = [];
      renderTeamPicker();
      document.getElementById('matchModalBackdrop').style.display = 'flex';
    }

    function closeMatchModal() {
      matchModalOpen = false;
      modalSelection = [];
      document.getElementById('matchModalBackdrop').style.display = 'none';
    }

    function renderTeamPicker() {
      const picker = document.getElementById('teamPicker');
      picker.innerHTML = '';

      teamIds().forEach(id => {
        const team = teamById(id);
        if (!team) return;

        const button = document.createElement('button');
        button.type = 'button';
        button.className = `team-choice choice-${id}`;

        if (modalSelection.includes(id)) button.classList.add('selected');
        if (modalSelection.length === 2 && !modalSelection.includes(id)) {
          button.classList.add('used');
        }

        button.textContent = team.name;
        button.addEventListener('click', () => selectModalTeam(id));
        picker.appendChild(button);
      });
    }

    function selectModalTeam(teamId) {
      if (!matchModalOpen) return;

      if (modalSelection.includes(teamId)) {
        modalSelection = modalSelection.filter(id => id !== teamId);
        renderTeamPicker();
        return;
      }

      if (modalSelection.length >= 2) return;

      modalSelection.push(teamId);
      renderTeamPicker();

      if (modalSelection.length === 2) {
        setTimeout(() => {
          if (!matchModalOpen || modalSelection.length !== 2) return;

          currentMatch = {
            teamA: modalSelection[0],
            teamB: modalSelection[1]
          };

          resetMatchScores();
          saveState();

          broadcastScoreEvent('match-start', null, {
            match: { ...currentMatch },
            scores: { yellow: 0, blue: 0, green: 0, red: 0 }
          });

          closeMatchModal();
          renderMatch();
        }, 220);
      }
    }

    function renderScoresOnly() {
      document.querySelectorAll('.team-panel').forEach(panel => {
        const team = teamById(panel.dataset.team);
        const score = panel.querySelector('.score');
        if (team && score && !score.classList.contains('score-editing')) {
          score.textContent = team.score || 0;
        }
      });
    }

    function renderMatch() {
      const area = document.getElementById('matchArea');

      if (!currentMatch.teamA || !currentMatch.teamB) {
        area.innerHTML = `
          <div class="empty-state">
            <div><strong>No match selected</strong></div>
          </div>
        `;
        return;
      }

      const ids = [currentMatch.teamA, currentMatch.teamB];

      area.innerHTML = `
        <div class="match-grid">
          ${ids.map(renderTeamPanel).join('')}
        </div>
      `;

      ids.forEach(id => {
        const search = document.querySelector(`[data-search-team="${id}"]`);
        if (!search) return;

        search.addEventListener('input', () => {
          filterTeamPlayers(id, search.value);
        });

        search.addEventListener('keydown', event => {
          if (event.key === 'Enter') {
            event.preventDefault();
            scoreFirstSearchMatch(id);
          }

          if (event.key === 'Escape') {
            search.value = '';
            filterTeamPlayers(id, '');
            search.blur();
          }
        });
      });
    }

    function renderTeamPanel(teamId) {
      const team = teamById(teamId);
      if (!team) return '';

      return `
        <section class="team-panel ${teamId}" data-team="${teamId}">
          <header class="team-header">
            <div class="team-name">${team.name}</div>
            <div
              class="score"
              data-score-team="${teamId}"
              role="button"
              tabindex="0"
              title="Click to edit score"
              onclick="startScoreEdit('${teamId}')"
              onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); startScoreEdit('${teamId}'); }"
            >${team.score || 0}</div>

            <button
              class="goal-button"
              data-goal-team="${teamId}"
              type="button"
              onclick="triggerGoal('${teamId}')"
            >Goal!</button>
          </header>

          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input
              class="player-search"
              data-search-team="${teamId}"
              type="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="Search player or number…"
              aria-label="Search ${team.name} players"
            />
          </div>

          <div class="player-list">
            ${team.players.map((player, index) => `
              <button
                class="player-button"
                type="button"
                data-player-team="${teamId}"
                data-player-index="${index}"
                onclick="triggerCelebration('${teamId}', ${index}, this)"
                aria-label="${player.name}, number ${player.number}"
              >
                <span class="player-name">${player.name}</span>
                <span class="player-number">${player.number}</span>
              </button>
            `).join('')}
          </div>
        </section>
      `;
    }

    const colorHotkeys = {
      r: 'red',
      b: 'blue',
      g: 'green',
      y: 'yellow'
    };

    document.addEventListener('keydown', event => {
      // Let the browser keep its normal refresh shortcut (Cmd/Ctrl + R).
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'r') {
        return;
      }

      // Escape always closes the New Match modal, even if focus is elsewhere.
      if (event.key === 'Escape' && matchModalOpen) {
        event.preventDefault();
        closeMatchModal();
        return;
      }

      const tag = event.target?.tagName;
      const isTyping =
        tag === 'INPUT' ||
        tag === 'TEXTAREA' ||
        tag === 'SELECT' ||
        event.target?.isContentEditable;

      if (isTyping) return;

      const key = event.key.toLowerCase();

      if (key === 'n' && !event.shiftKey) {
        event.preventDefault();
        openMatchModal();
        return;
      }

      if (colorHotkeys[key]) {
        event.preventDefault();

        const teamId = colorHotkeys[key];

        if (event.shiftKey) {
          // Shift + color key = goal for that team.
          triggerGoal(teamId);
        } else if (matchModalOpen) {
          selectModalTeam(teamId);
        } else {
          focusTeamSearch(teamId);
        }
      }
    });

    document.getElementById('cancelMatchBtn').addEventListener('click', closeMatchModal);

    document.getElementById('matchModalBackdrop').addEventListener('click', event => {
      if (event.target.id === 'matchModalBackdrop') closeMatchModal();
    });

    loadState();
    initConfetti();
    initMIDI();
    initScoreChannel();
    updateMediaPlayerUI();
    renderMatch();

    if (!currentMatch.teamA || !currentMatch.teamB) {
      openMatchModal();
    }
  </script>
</body>
</html>
