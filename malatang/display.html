<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malatang  🖥</title>
  <link rel="icon" href="../icons/BGicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e8f4fc;
      font-family: "SF Pro Display", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #0d47a1;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .layout {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
      padding: 2.2vh 3vw;
      gap: 2.2vh;
    }

    .ready-section {
      background: #ffffff;
      border: 2px solid #90caf9;
      padding: 1.8vh 2.5vw;
      min-height: 28vh;
      display: flex;
      flex-direction: column;
    }

    .section-title {
      font-size: clamp(22px, 2.4vw, 36px);
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 1.4vh;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #0d47a1;
    }

    .section-title .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #0d47a1;
      box-shadow: 0 0 10px rgba(13,71,161,0.4);
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .ready-list {
      display: flex;
      flex-wrap: wrap;
      gap: 1.4vw;
      align-items: center;
      flex: 1;
      align-content: flex-start;
    }

    /* Preferred #3 flat puck / coin style */
    .ready-item {
      width: 5.8vw;
      height: 5.8vw;
      max-width: 90px;
      max-height: 90px;
      min-width: 58px;
      min-height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 45%, #ef5350 0%, #c62828 70%, #8e0000 100%);
      box-shadow:
        inset 0 1px 1.5px rgba(255,255,255,0.5),
        inset 0 -2.5px 4px rgba(0,0,0,0.5),
        0 0 0 1.5px rgba(255,180,180,0.2),
        0 3px 5px rgba(0,0,0,0.45),
        0 1px 1px rgba(0,0,0,0.3);
      border: 1px solid rgba(180,30,30,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(22px, 2.6vw, 40px);
      font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.65);
      animation: popIn 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
      cursor: default;
      pointer-events: none;
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.32s ease;
    }

    .ready-item.removing {
      transform: scale(0.18);
      opacity: 0;
    }

    @keyframes popIn {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .ready-empty {
      font-size: clamp(16px, 1.6vw, 24px);
      color: #90a4ae;
      font-style: italic;
    }

    .cooking-section {
      background: #ffffff;
      border: 2px solid #90caf9;
      padding: 1.8vh 2.5vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .cooking-list {
      display: flex;
      flex-direction: column;
      gap: 1.5vh;
      overflow-y: auto;
      flex: 1;
      padding-right: 8px;
    }

    .cooking-list::-webkit-scrollbar {
      width: 6px;
    }
    .cooking-list::-webkit-scrollbar-thumb {
      background: rgba(13,71,161,0.2);
    }

    .cooking-row {
      display: grid;
      grid-template-columns: 70px 1fr;
      align-items: center;
      gap: 1.6vw;
      background: #f5fbff;
      border: 1px solid #e3f2fd;
      padding: 1.1vh 1.4vw;
      animation: slideIn 0.4s ease-out;
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .cooking-row.leaving {
      opacity: 0;
      transform: translateX(-24px);
    }

    @keyframes slideIn {
      from { transform: translateX(-30px); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }

    /* Preferred #3 flat puck / coin style */
    .cooking-num {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 45%, #ef5350 0%, #c62828 70%, #8e0000 100%);
      box-shadow:
        inset 0 1px 1.5px rgba(255,255,255,0.5),
        inset 0 -2.5px 4px rgba(0,0,0,0.5),
        0 0 0 1.5px rgba(255,180,180,0.2),
        0 3px 5px rgba(0,0,0,0.45),
        0 1px 1px rgba(0,0,0,0.3);
      border: 1px solid rgba(180,30,30,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.65);
      flex-shrink: 0;
    }

    .progress-wrap {
      height: 18px;
      background: #e3f2fd;
      overflow: hidden;
      position: relative;
      border-radius: 9px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: rgba(76, 175, 80, 0.55);
      border-radius: 9px;
      will-change: width;
    }

    .cooking-empty {
      font-size: clamp(16px, 1.6vw, 24px);
      color: #90a4ae;
      font-style: italic;
      margin-top: 1vh;
    }
  </style>
</head>
<body>
  <div class="layout">
    <section class="ready-section">
      <div class="section-title">
        <span class="dot"></span>
        READY FOR PICKUP
      </div>
      <div class="ready-list" id="readyList">
        <div class="ready-empty" id="readyEmpty">Waiting for orders…</div>
      </div>
    </section>

    <section class="cooking-section">
      <div class="section-title">
        <span class="dot"></span>
        CURRENTLY COOKING
      </div>
      <div class="cooking-list" id="cookingList">
        <div class="cooking-empty" id="cookingEmpty">No items cooking</div>
      </div>
    </section>
  </div>

  <script>
    const cooking = new Map();
    const ready   = new Map();

    const audioQueue = [];
    let isPlaying = false;
    let lastAnnounceTime = 0;
    let burstCount = 0;

    const FULL_REENNOUNCE_GAP = 5500;
    const BURST_WINDOW = 3200;
    const INTER_CLIP_GAP = 180;

    const COOK_DURATION_MS = 4 * 60 * 1000; // 4 minutes
    const ASYMPTOTE_K = 1.9;        

    function playClip(src) {
      return new Promise((resolve) => {
        const audio = new Audio(src);
        audio.preload = 'auto';
        const done = (e) => {
          if (e && e.type === 'error') {
            console.warn('[audio] failed to load/play', src, audio.error);
          }
          audio.onended = null;
          audio.onerror = null;
          resolve();
        };
        audio.onended = done;
        audio.onerror = done;
        audio.play().catch(err => {
          console.warn('[audio] play() rejected (autoplay policy?)', src, err);
          done();
        });
      });
    }

    async function drainQueue() {
      if (isPlaying) return;
      isPlaying = true;
      while (audioQueue.length > 0) {
        const src = audioQueue.shift();
        await playClip(src);
        if (audioQueue.length > 0) {
          await new Promise(r => setTimeout(r, INTER_CLIP_GAP));
        }
      }
      isPlaying = false;
    }

    function enqueue(...srcs) {
      const withPath = srcs.map(s => s.startsWith('audio/') ? s : `audio/${s}`);
      audioQueue.push(...withPath);
      console.log('[audio] queued', withPath);
      drainQueue();
    }

    function pickSingular() {
      return Math.random() < 0.5 ? 'singular.mp3' : 'singular2.mp3';
    }

    function pickMultiple() {
      return Math.random() < 0.5 ? 'multiple.mp3' : 'multiple2.mp3';
    }

    function buildListAnnouncement(nums) {
      if (nums.length === 0) return [];

      if (nums.length === 1) {
        const usePlease = Math.random() < 0.42;
        if (usePlease) {
          return [`${nums[0]}please.mp3`];
        }
        const files = [`${nums[0]}.mp3`];
        if (Math.random() < 0.7) {
          files.push(pickSingular());
        }
        return files;
      }

      const files = [];
      for (let i = 0; i < nums.length; i++) {
        const isLast = (i === nums.length - 1);
        if (isLast) {
          const usePlease = Math.random() < 0.38;
          files.push(usePlease ? `and${nums[i]}please.mp3` : `and${nums[i]}.mp3`);
        } else {
          files.push(`${nums[i]}.mp3`);
        }
      }

      const last = files[files.length - 1];
      if (!last.includes('please')) {
        files.push(pickMultiple());
      }
      return files;
    }

    function buildSingleAnnouncement(num) {
      const usePlease = Math.random() < 0.40;
      if (usePlease) {
        return [`${num}please.mp3`];
      }

      const files = [`${num}.mp3`];
      if (burstCount <= 2 && Math.random() < 0.75) {
        files.push(pickSingular());
      }
      return files;
    }

    function announceReady(num) {
      const now = Date.now();
      const current = Array.from(ready.keys()).sort((a, b) => a - b);

      if (now - lastAnnounceTime > BURST_WINDOW) {
        burstCount = 0;
      }
      burstCount++;

      if (now - lastAnnounceTime > FULL_REENNOUNCE_GAP && current.length > 0) {
        enqueue(...buildListAnnouncement(current));
        burstCount = 0;
      } else {
        enqueue(...buildSingleAnnouncement(num));
      }

      lastAnnounceTime = now;
    }

    async function initMIDI() {
  if (!navigator.requestMIDIAccess) {
    return;
  }
  try {
    const access = await navigator.requestMIDIAccess({ sysex: false });
    const inputs = Array.from(access.inputs.values());

    let input = inputs.find(i =>
      /iac/i.test(i.name) && /1/.test(i.name)
    ) || inputs.find(i => /iac/i.test(i.name)) || inputs[0] || null;

    if (input) {
      input.onmidimessage = onMIDIMessage;
    }

    access.onstatechange = () => {
      const ins = Array.from(access.inputs.values());
      const prefer = ins.find(i =>
        /iac/i.test(i.name) && /1/.test(i.name)
      ) || ins[0];
      if (prefer) {
        prefer.onmidimessage = onMIDIMessage;
      }
    };
  } catch (err) {
    console.warn(err);
  }
}

    function onMIDIMessage(event) {
      const [status, note, velocity] = event.data;
      if (velocity === 0) return;

      const channel = (status & 0x0f) + 1;
      const command = status & 0xf0;
      if (command !== 0x90) return;

      if (channel === 1) {
        addCooking(note);
      } else if (channel === 2) {
        moveToReady(note);
      } else if (channel === 3) {
        removeReady(note);
      }
    }

    function addCooking(num) {
      if (cooking.has(num)) return;

      if (ready.has(num)) {
        // If it was already ready, animate it out first
        removeReady(num);
      }

      const list = document.getElementById('cookingList');
      document.getElementById('cookingEmpty')?.remove();

      const row = document.createElement('div');
      row.className = 'cooking-row';
      row.innerHTML = `
        <div class="cooking-num">${num}</div>
        <div class="progress-wrap">
          <div class="progress-bar"></div>
        </div>
      `;
      list.appendChild(row);
      cooking.set(num, row);

      // Start asymptotic progress
      const bar = row.querySelector('.progress-bar');
      const startTime = Date.now();

      function tick() {
        if (!cooking.has(num)) return; // stopped (order finished or cancelled)
        const elapsed = Date.now() - startTime;
        const t = elapsed / COOK_DURATION_MS;
        // Asymptotic approach: ~94% at 4 min, continues slowly afterward
        const progress = 1 - Math.exp(-ASYMPTOTE_K * t);
        bar.style.width = Math.min(progress * 100, 99.2) + '%';
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function moveToReady(num) {
      if (cooking.has(num)) {
        const row = cooking.get(num);
        cooking.delete(num); // stops the progress ticker immediately

        const bar = row.querySelector('.progress-bar');
        // Quick fill to 100%
        bar.style.transition = 'width 0.42s cubic-bezier(0.22, 0.9, 0.3, 1)';
        bar.style.width = '100%';

        // After fill, fade the cooking row out, then add to ready
        setTimeout(() => {
          row.classList.add('leaving');
          setTimeout(() => {
            row.remove();
            if (cooking.size === 0) {
              const list = document.getElementById('cookingList');
              if (!document.getElementById('cookingEmpty')) {
                const empty = document.createElement('div');
                empty.className = 'cooking-empty';
                empty.id = 'cookingEmpty';
                empty.textContent = 'No items cooking';
                list.appendChild(empty);
              }
            }
          }, 280);
        }, 450);
      }

      // Add to ready (slight delay so it feels sequential with the fill)
      setTimeout(() => {
        if (ready.has(num)) return;

        const list = document.getElementById('readyList');
        document.getElementById('readyEmpty')?.remove();

        const item = document.createElement('div');
        item.className = 'ready-item';
        item.textContent = num;
        list.appendChild(item);
        ready.set(num, item);

        announceReady(num);
      }, 520);
    }

    function removeReady(num) {
      if (!ready.has(num)) return;

      const item = ready.get(num);
      item.classList.add('removing');

      // Allow the scale/fade to play, then clean up.
      // Remaining items will reflow naturally after removal.
      setTimeout(() => {
        item.remove();
        ready.delete(num);
        updateReadyEmpty();
      }, 340);
    }

    function updateReadyEmpty() {
      if (ready.size === 0) {
        const list = document.getElementById('readyList');
        if (!document.getElementById('readyEmpty')) {
          const empty = document.createElement('div');
          empty.className = 'ready-empty';
          empty.id = 'readyEmpty';
          empty.textContent = 'Waiting for orders…';
          list.appendChild(empty);
        }
      }
    }

    initMIDI();
  </script>
</body>
</html>
