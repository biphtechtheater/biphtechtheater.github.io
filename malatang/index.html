<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Malatang 🥘</title>
  <link rel="icon" href="../icons/BGicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      position: relative;
      width: min(100vw, 100vh * 9 / 16);
      height: min(100vh, 100vw * 16 / 9);
      overflow: hidden;
      background: #000;
      flex-shrink: 0;
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .buttons {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .btn {
      position: absolute;
      width: 11.8%;
      aspect-ratio: 1;
      max-width: 64px;
      max-height: 64px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 45%, #ef5350 0%, #c62828 70%, #8e0000 100%);
      box-shadow:
        inset 0 1px 1.5px rgba(255,255,255,0.5),
        inset 0 -2.5px 4px rgba(0,0,0,0.5),
        0 0 0 1.5px rgba(255,180,180,0.2),
        0 3px 5px rgba(0,0,0,0.45),
        0 1px 1px rgba(0,0,0,0.3);
      border: 1px solid rgba(180,30,30,0.6);
      color: #fff;
      font-size: clamp(15px, 4.6vw, 24px);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition:
        top 0.48s cubic-bezier(0.34, 1.25, 0.64, 1),
        left 0.48s cubic-bezier(0.34, 1.25, 0.64, 1),
        transform 0.18s ease;
      will-change: top, left;
      text-shadow: 0 1px 2px rgba(0,0,0,0.65);
      z-index: 15;
    }

    .btn:active {
      transform: scale(0.9);
    }

    .row-with-lines {
      position: relative;
    }

    /* ========== WEBRTC MODAL ========== */

    #webrtc-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(0,0,0,0.42);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    #webrtc-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(420px, calc(100vw - 32px));
      z-index: 100;
      background: rgba(0,0,0,0.88);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 16px;
      padding: 18px;
      font-family: system-ui, sans-serif;
      box-shadow: 0 18px 50px rgba(0,0,0,0.5);
    }

    #webrtc-panel h2 {
      font-size: 16px;
      margin-bottom: 8px;
      letter-spacing: .04em;
    }

    #connection-status {
      font-size: 12px;
      color: #c8c8c8;
      margin-bottom: 12px;
      line-height: 1.35;
      min-height: 16px;
    }

    .rtc-textarea {
      display: block;
      width: 100%;
      height: 70px;
      resize: none;
      border: 1px solid #555;
      border-radius: 8px;
      background: #111;
      color: #eee;
      padding: 8px;
      font: 10px/1.25 ui-monospace, monospace;
      user-select: text;
      -webkit-user-select: text;
    }

    .rtc-btn {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 11px 8px;
      background: #1565c0;
      color: white;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .rtc-btn:disabled {
      opacity: .4;
      cursor: default;
    }

    #create-offer {
      margin-top: 4px;
    }

    #answer {
      margin-top: 10px;
    }

    #connect {
      margin-top: 8px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="webrtc-backdrop"></div>

  <div id="webrtc-panel">
    <h2>WEBRTC • CONTROL</h2>
    <div id="connection-status">Generate an offer to connect to DISPLAY.</div>

    <button class="rtc-btn" id="create-offer">Generate offer</button>

    <textarea
      id="answer"
      class="rtc-textarea"
      placeholder="Paste the response from DISPLAY here"
    ></textarea>

    <button class="rtc-btn" id="connect" disabled>Submit</button>
  </div>

  <div class="stage" id="stage">
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="backgroundvideo.mov" type="video/mp4">
    </video>

    <div class="row-with-lines">
      <div class="hline hline-1"></div>
      <div class="hline hline-2"></div>
    </div>

    <div class="overlay"></div>
    <div class="buttons" id="buttons"></div>
  </div>

  <script>
    /* ========== WEBRTC ========== */

    let peer = null;
    let dataChannel = null;

    const rtcPanel = document.getElementById('webrtc-panel');
    const rtcBackdrop = document.getElementById('webrtc-backdrop');
    const statusEl = document.getElementById('connection-status');
    const answerEl = document.getElementById('answer');
    const createOfferBtn = document.getElementById('create-offer');
    const connectBtn = document.getElementById('connect');

    function setRTCStatus(text) {
      statusEl.textContent = text;
    }

    function waitForIceComplete(pc) {
      if (pc.iceGatheringState === 'complete') {
        return Promise.resolve();
      }

      return new Promise(resolve => {
        const check = () => {
          if (pc.iceGatheringState === 'complete') {
            pc.removeEventListener('icegatheringstatechange', check);
            resolve();
          }
        };

        pc.addEventListener('icegatheringstatechange', check);
      });
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();

        let copied = false;
        try {
          copied = document.execCommand('copy');
        } catch {}

        textarea.remove();
        return copied;
      }
    }

    function setupDataChannel(channel) {
      dataChannel = channel;

      channel.onopen = () => {
        setRTCStatus('Connected!');
        setTimeout(closeRTCModal, 1000);
      };

      channel.onclose = () => {
        dataChannel = null;
        createOfferBtn.disabled = false;
        connectBtn.disabled = true;
      };

      channel.onerror = err => {
        console.warn('[WebRTC] data channel error', err);
      };
    }

    async function createOffer() {
      try {
        if (peer) peer.close();

        peer = new RTCPeerConnection();

        setupDataChannel(peer.createDataChannel('malatang'));

        peer.onconnectionstatechange = () => {
          if (peer.connectionState === 'failed') {
            setRTCStatus('Connection failed.');
          }
        };

        const offer = await peer.createOffer();
        await peer.setLocalDescription(offer);

        setRTCStatus('Generating offer…');
        await waitForIceComplete(peer);

        const offerText = JSON.stringify(peer.localDescription);
        const copied = await copyText(offerText);

        if (!copied) {
          setRTCStatus('Offer generated, but could not copy it.');
          return;
        }

        setRTCStatus('Offer copied to clipboard. Paste it into DISPLAY.');
        createOfferBtn.disabled = true;
        connectBtn.disabled = !answerEl.value.trim();

      } catch (err) {
        console.error(err);
        setRTCStatus('Could not create offer.');
      }
    }

    async function connectToAnswer() {
      try {
        if (!peer) {
          setRTCStatus('Generate an offer first.');
          return;
        }

        const answer = JSON.parse(answerEl.value.trim());

        await peer.setRemoteDescription(answer);

        setRTCStatus('Connecting…');
      } catch (err) {
        console.error(err);
        setRTCStatus('Invalid response.');
      }
    }

    function closeRTCModal() {
      rtcPanel.classList.add('hidden');
      rtcBackdrop.classList.add('hidden');
    }

    createOfferBtn.addEventListener('click', createOffer);

    answerEl.addEventListener('input', () => {
      connectBtn.disabled = !answerEl.value.trim();
    });

    connectBtn.addEventListener('click', connectToAnswer);

    /* ========== COMMANDS ========== */

    function sendCommand(channel, note) {
      if (!dataChannel || dataChannel.readyState !== 'open') {
        return;
      }

      dataChannel.send(JSON.stringify({
        type: 'malatang',
        channel,
        note,
        timestamp: Date.now()
      }));
    }

    /* ========== BUTTONS ========== */

    const TOTAL = 15;
    const buttons = [];

    const COOKING_ZONES = {
      left: [
        { x: 0.10, y: 0.345 },
        { x: 0.22, y: 0.330 },
        { x: 0.34, y: 0.345 },
        { x: 0.10, y: 0.435 },
        { x: 0.22, y: 0.445 },
        { x: 0.34, y: 0.435 },
        { x: 0.16, y: 0.390 },
        { x: 0.28, y: 0.390 }
      ],
      right: [
        { x: 0.66, y: 0.345 },
        { x: 0.78, y: 0.330 },
        { x: 0.90, y: 0.345 },
        { x: 0.66, y: 0.435 },
        { x: 0.78, y: 0.445 },
        { x: 0.90, y: 0.435 },
        { x: 0.72, y: 0.390 },
        { x: 0.84, y: 0.390 }
      ]
    };

    const occupied = {
      left: new Set(),
      right: new Set()
    };

    function createButtons() {
      const container = document.getElementById('buttons');

      for (let i = 1; i <= TOTAL; i++) {
        const btn = document.createElement('div');

        btn.className = 'btn';
        btn.textContent = i;
        btn.dataset.num = i;
        btn.dataset.state = 'waiting';

        container.appendChild(btn);
        buttons.push(btn);

        btn.addEventListener('click', () => toggleButton(btn));
      }

      requestAnimationFrame(() => {
        buttons.forEach(b => {
          const s = b.offsetWidth;
          b.style.height = s + 'px';
        });

        layoutGrid('waiting');
      });
    }

    function layoutGrid(state) {
      const stage = document.getElementById('stage');
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      const size = buttons[0].offsetWidth;

      const marginX = w * 0.055;
      const usableW = w - marginX * 2;

      let startY, usableH, rows;

      if (state === 'waiting') {
        startY = h * 0.7;
        usableH = h * 0.215;
        rows = 3;

        const cols = 5;
        const gapX = (usableW - cols * size) / (cols - 1);
        const gapY = (usableH - rows * size) / (rows - 1);

        const stateButtons = buttons.filter(b => b.dataset.state === state);

        stateButtons.forEach((btn, idx) => {
          const col = idx % cols;
          const row = Math.floor(idx / cols);

          const x = marginX + col * (size + gapX);
          const y = startY + row * (size + gapY);

          btn.style.left = x + 'px';
          btn.style.top = y + 'px';
        });

      } else {
        startY = h * 0.02;
        usableH = h * 0.22;
        rows = 3;

        const rowCounts = [3, 6, 6];
        const gapY = (usableH - rows * size) / (rows - 1);

        const stateButtons = buttons.filter(b => b.dataset.state === state);

        let idx = 0;

        for (let row = 0; row < rows; row++) {
          const cols = rowCounts[row];

          let gapX = cols > 1
            ? (usableW - cols * size) / (cols - 1)
            : 0;

          if (row === 0) {
            gapX = window.innerWidth * 0.06;
          }

          const rowWidth = cols * size + (cols - 1) * gapX;

          let startX;

          if (row === 0) {
            startX = w - marginX - rowWidth;
          } else {
            startX = (w - rowWidth) / 2;
          }

          for (let col = 0; col < cols; col++) {
            if (idx >= stateButtons.length) break;

            const btn = stateButtons[idx++];

            const x = startX + col * (size + gapX);
            const y = startY + row * (size + gapY);

            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
          }
        }
      }
    }

    function findFreeSlot(side) {
      const zone = COOKING_ZONES[side];

      for (let i = 0; i < zone.length; i++) {
        if (!occupied[side].has(i)) {
          return i;
        }
      }

      return Math.floor(Math.random() * zone.length);
    }

    function placeInCooking(btn) {
      const leftCount = occupied.left.size;
      const rightCount = occupied.right.size;

      const side = leftCount <= rightCount ? 'left' : 'right';
      const slotIdx = findFreeSlot(side);

      occupied[side].add(slotIdx);

      const stage = document.getElementById('stage');
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      const size = btn.offsetWidth;

      const pos = COOKING_ZONES[side][slotIdx];

      const x = pos.x * w - size / 2;
      const y = pos.y * h - size / 2;

      btn.dataset.state = 'cooking';
      btn.dataset.side = side;
      btn.dataset.slot = slotIdx;

      btn.style.left =
        Math.max(2, Math.min(w - size - 2, x)) + 'px';

      btn.style.top =
        Math.max(2, Math.min(h - size - 2, y)) + 'px';
    }

    function clearCookingSlot(btn) {
      const side = btn.dataset.side;
      const slot = parseInt(btn.dataset.slot, 10);

      if (side && !isNaN(slot)) {
        occupied[side].delete(slot);
      }

      delete btn.dataset.side;
      delete btn.dataset.slot;
    }

    function toggleButton(btn) {
      const num = parseInt(btn.dataset.num, 10);
      const state = btn.dataset.state;

      if (state === 'waiting') {
        placeInCooking(btn);
        sendCommand(1, num);

      } else if (state === 'cooking') {
        clearCookingSlot(btn);
        btn.dataset.state = 'ready';
        layoutGrid('ready');
        sendCommand(2, num);

      } else {
        btn.dataset.state = 'waiting';
        layoutGrid('waiting');
        sendCommand(3, num);
      }
    }

    let resizeTimer;

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);

      resizeTimer = setTimeout(() => {
        buttons.forEach(b => {
          const s = b.offsetWidth;
          b.style.height = s + 'px';
        });

        buttons.forEach(btn => {
          if (btn.dataset.state === 'cooking') {
            const side = btn.dataset.side;
            const slot = parseInt(btn.dataset.slot, 10);

            const stage = document.getElementById('stage');
            const w = stage.clientWidth;
            const h = stage.clientHeight;
            const size = btn.offsetWidth;

            const pos = COOKING_ZONES[side][slot];

            const x = pos.x * w - size / 2;
            const y = pos.y * h - size / 2;

            btn.style.left =
              Math.max(2, Math.min(w - size - 2, x)) + 'px';

            btn.style.top =
              Math.max(2, Math.min(h - size - 2, y)) + 'px';
          }
        });

        layoutGrid('waiting');
        layoutGrid('ready');
      }, 60);
    });

    createButtons();
  </script>
</body>
</html>
