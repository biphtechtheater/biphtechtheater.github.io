<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Malatang  🥘</title>
  <link rel="icon" href="../icons/BGicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      position: relative;
      width: min(100vw, 100vh * 9 / 16);
      height: min(100vh, 100vw * 16 / 9);
      overflow: hidden;
      background: #000;
      flex-shrink: 0;
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .buttons {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

  .btn {
  position: absolute;
  width: 11.8%;
  aspect-ratio: 1;
  max-width: 64px;
  max-height: 64px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, #ef5350 0%, #c62828 70%, #8e0000 100%);
  box-shadow:
    inset 0 1px 1.5px rgba(255,255,255,0.5),
    inset 0 -2.5px 4px rgba(0,0,0,0.5),
    0 0 0 1.5px rgba(255,180,180,0.2),
    0 3px 5px rgba(0,0,0,0.45),
    0 1px 1px rgba(0,0,0,0.3);
  border: 1px solid rgba(180,30,30,0.6);
  color: #fff;
  font-size: clamp(15px, 4.6vw, 24px);
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 
    top 0.48s cubic-bezier(0.34, 1.25, 0.64, 1),
    left 0.48s cubic-bezier(0.34, 1.25, 0.64, 1),
    transform 0.18s ease;
  will-change: top, left;
  text-shadow: 0 1px 2px rgba(0,0,0,0.65);
  z-index: 15;
}

    .btn:active {
      transform: scale(0.9);
    }

    .row-with-lines{
  position: relative;
}

  </style>
</head>
<body>
  <div class="stage" id="stage">
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="backgroundvideo.mov" type="video/mp4">
    </video>

      <div class="row-with-lines">
  <div class="hline hline-1"></div>
  <div class="hline hline-2"></div>
</div>

    <div class="overlay"></div>
    <div class="buttons" id="buttons"></div>
  </div>

  <script>
    let midiOutput = null;

    async function initMIDI() {
  if (!navigator.requestMIDIAccess) {
    return;
  }
  try {
    const access = await navigator.requestMIDIAccess({ sysex: false });
    const outputs = Array.from(access.outputs.values());

    midiOutput = outputs.find(o =>
      /iac/i.test(o.name) && /1/.test(o.name)
    ) || outputs.find(o => /iac/i.test(o.name)) || outputs[0] || null;

    access.onstatechange = () => {
      const outs = Array.from(access.outputs.values());
      midiOutput = outs.find(o =>
        /iac/i.test(o.name) && /1/.test(o.name)
      ) || outs[0] || null;
    };
  } catch (err) {
    console.warn(err);
  }
}

    function sendNote(channel, noteNumber, velocity = 100) {
      if (!midiOutput) return;
      const status = 0x90 + (channel - 1);
      midiOutput.send([status, noteNumber, velocity]);
      setTimeout(() => midiOutput.send([status, noteNumber, 0]), 60);
    }

    const TOTAL = 15;
    const buttons = [];

    // Cooking zone (middle) – slightly lower, left more left, right more right
    const COOKING_ZONES = {
      left: [
        { x: 0.10, y: 0.345 },
        { x: 0.22, y: 0.330 },
        { x: 0.34, y: 0.345 },
        { x: 0.10, y: 0.435 },
        { x: 0.22, y: 0.445 },
        { x: 0.34, y: 0.435 },
        { x: 0.16, y: 0.390 },
        { x: 0.28, y: 0.390 }
      ],
      right: [
        { x: 0.66, y: 0.345 },
        { x: 0.78, y: 0.330 },
        { x: 0.90, y: 0.345 },
        { x: 0.66, y: 0.435 },
        { x: 0.78, y: 0.445 },
        { x: 0.90, y: 0.435 },
        { x: 0.72, y: 0.390 },
        { x: 0.84, y: 0.390 }
      ]
    };

    const occupied = {
      left:  new Set(),
      right: new Set()
    };

    function createButtons() {
      const container = document.getElementById('buttons');
      for (let i = 1; i <= TOTAL; i++) {
        const btn = document.createElement('div');
        btn.className = 'btn';
        btn.textContent = i;
        btn.dataset.num = i;
        btn.dataset.state = 'waiting';
        container.appendChild(btn);
        buttons.push(btn);
        btn.addEventListener('click', () => toggleButton(btn));
      }
      requestAnimationFrame(() => {
        buttons.forEach(b => {
          const s = b.offsetWidth;
          b.style.height = s + 'px';
        });
        layoutGrid('waiting');
      });
    }

    function layoutGrid(state) {
  const stage = document.getElementById('stage');
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  const size = buttons[0].offsetWidth;

  const marginX = w * 0.055;
  const usableW = w - marginX * 2;

  let startY, usableH, rows;
  if (state === 'waiting') {
    startY = h * 0.7;
    usableH = h * 0.215;
    rows = 3;
    const cols = 5;
    const gapX = (usableW - cols * size) / (cols - 1);
    const gapY = (usableH - rows * size) / (rows - 1);

    const stateButtons = buttons.filter(b => b.dataset.state === state);
    stateButtons.forEach((btn, idx) => {
      const col = idx % cols;
      const row = Math.floor(idx / cols);
      const x = marginX + col * (size + gapX);
      const y = startY + row * (size + gapY);
      btn.style.left = x + 'px';
      btn.style.top  = y + 'px';
    });
  } else { // ready – top: 3 / 6 / 6
    startY = h * 0.02;
    usableH = h * 0.22;
    rows = 3;
    const rowCounts = [3, 6, 6];
    const gapY = (usableH - rows * size) / (rows - 1);

    const stateButtons = buttons.filter(b => b.dataset.state === state);
    let idx = 0;
    for (let row = 0; row < rows; row++) {
      const cols = rowCounts[row];
      // default even spacing
      let gapX = cols > 1 ? (usableW - cols * size) / (cols - 1) : 0;

      // ——— fine-tune top row spacing here ———
      if (row === 0) {
  gapX = window.innerWidth * 0.06; // 1.2% * 1.2 = 1.44% of viewport width
}
      // ————————————————————————————————

      const rowWidth = cols * size + (cols - 1) * gapX;

      // row 0 = right-justified, others = centered
      let startX;
      if (row === 0) {
        startX = w - marginX - rowWidth;   // right edge
      } else {
        startX = (w - rowWidth) / 2;       // centered
      }

      for (let col = 0; col < cols; col++) {
        if (idx >= stateButtons.length) break;
        const btn = stateButtons[idx++];
        const x = startX + col * (size + gapX);
        const y = startY + row * (size + gapY);
        btn.style.left = x + 'px';
        btn.style.top  = y + 'px';
      }
    }
  }
}

    function findFreeSlot(side) {
      const zone = COOKING_ZONES[side];
      for (let i = 0; i < zone.length; i++) {
        if (!occupied[side].has(i)) return i;
      }
      return Math.floor(Math.random() * zone.length);
    }

    function placeInCooking(btn) {
      const leftCount  = occupied.left.size;
      const rightCount = occupied.right.size;
      const side = leftCount <= rightCount ? 'left' : 'right';

      const slotIdx = findFreeSlot(side);
      occupied[side].add(slotIdx);

      const stage = document.getElementById('stage');
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      const size = btn.offsetWidth;

      const pos = COOKING_ZONES[side][slotIdx];
      const x = pos.x * w - size / 2;
      const y = pos.y * h - size / 2;

      btn.dataset.state = 'cooking';
      btn.dataset.side = side;
      btn.dataset.slot = slotIdx;

      btn.style.left = Math.max(2, Math.min(w - size - 2, x)) + 'px';
      btn.style.top  = Math.max(2, Math.min(h - size - 2, y)) + 'px';
    }

    function clearCookingSlot(btn) {
      const side = btn.dataset.side;
      const slot = parseInt(btn.dataset.slot, 10);
      if (side && !isNaN(slot)) {
        occupied[side].delete(slot);
      }
      delete btn.dataset.side;
      delete btn.dataset.slot;
    }

    function toggleButton(btn) {
      const num = parseInt(btn.dataset.num, 10);
      const state = btn.dataset.state;

      if (state === 'waiting') {
        placeInCooking(btn);
        sendNote(1, num);
      } else if (state === 'cooking') {
        clearCookingSlot(btn);
        btn.dataset.state = 'ready';
        layoutGrid('ready');
        sendNote(2, num);
      } else {
        btn.dataset.state = 'waiting';
        layoutGrid('waiting');
        sendNote(3, num);
      }
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        buttons.forEach(b => {
          const s = b.offsetWidth;
          b.style.height = s + 'px';
        });

        buttons.forEach(btn => {
          if (btn.dataset.state === 'cooking') {
            const side = btn.dataset.side;
            const slot = parseInt(btn.dataset.slot, 10);
            const stage = document.getElementById('stage');
            const w = stage.clientWidth;
            const h = stage.clientHeight;
            const size = btn.offsetWidth;
            const pos = COOKING_ZONES[side][slot];
            const x = pos.x * w - size / 2;
            const y = pos.y * h - size / 2;
            btn.style.left = Math.max(2, Math.min(w - size - 2, x)) + 'px';
            btn.style.top  = Math.max(2, Math.min(h - size - 2, y)) + 'px';
          }
        });
        layoutGrid('waiting');
        layoutGrid('ready');
      }, 60);
    });

    initMIDI();
    createButtons();
  </script>
</body>
</html>
